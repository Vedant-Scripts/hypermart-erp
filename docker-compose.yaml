services:
  postgres-db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: hypermart_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  backend:
    build: .
    depends_on:
      - postgres-db
    env_file:
      - .env.dev
    ports:
      - "5000:5000"
    command: ["pnpm", "start"]
    

volumes:
  pgdata: